<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Connected dog bowl: the scale and its wiring</title>
  <rect x="1" y="1" width="1098" height="698" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Side view: bowl on the S-shaped scale -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f2328">The scale, seen from the side</text>
  <path d="M150 112 L330 112 L310 190 L170 190 Z" fill="#e8eef5" stroke="#6e7781" stroke-width="2.5"/>
  <path d="M157 138 L323 138 L310 188 L170 188 Z" fill="#9cc8f0"/>
  <text x="240" y="170" font-size="14" text-anchor="middle" fill="#1f4e79">water</text>
  <rect x="80" y="190" width="320" height="12" rx="3" fill="#d8ecf8" stroke="#7aa7d6" stroke-width="1.5"/>
  <rect x="300" y="202" width="40" height="8" fill="#8c959f"/>
  <rect x="140" y="210" width="200" height="22" rx="3" fill="#c9ced6" stroke="#6e7781" stroke-width="1.5"/>
  <rect x="140" y="232" width="40" height="8" fill="#8c959f"/>
  <rect x="80" y="240" width="320" height="12" rx="3" fill="#d8ecf8" stroke="#7aa7d6" stroke-width="1.5"/>
  <line x1="40" y1="253" x2="450" y2="253" stroke="#6e7781" stroke-width="2"/>
  <path d="M340 221 C 380 221, 400 270, 440 270" fill="none" stroke="#6e7781" stroke-width="3"/>
  <text x="448" y="275" font-size="15" fill="#57606a">cable to the HX711</text>
  <text x="410" y="200" font-size="14" fill="#57606a">top plate</text>
  <text x="410" y="250" font-size="14" fill="#57606a">bottom plate</text>
  <text x="240" y="226" font-size="12" text-anchor="middle" fill="#1f2328">load cell</text>
  <text x="40" y="285" font-size="13" fill="#8c959f">Each plate is screwed to one end of the cell: the whole forms an "S".</text>

  <!-- Notes -->
  <rect x="690" y="40" width="370" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="710" y="72" font-size="17" font-weight="700" fill="#1f2328">Good to know</text>
  <circle cx="716" cy="98" r="5" fill="#cf222e"/>
  <text x="730" y="103" font-size="15" fill="#1f2328">VCC on 3V3, not 5 V</text>
  <circle cx="716" cy="128" r="5" fill="#2f6fdb"/>
  <text x="730" y="133" font-size="15" fill="#1f2328">DT on D0, SCK on D1 (dogbowl.yaml)</text>
  <circle cx="716" cy="158" r="5" fill="#57606a"/>
  <text x="730" y="163" font-size="15" fill="#1f2328">A reading every 10 seconds</text>
  <circle cx="716" cy="188" r="5" fill="#1f7a4d"/>
  <text x="730" y="193" font-size="15" fill="#1f2328">Calibrated with an empty bowl,</text>
  <text x="730" y="213" font-size="15" fill="#1f2328">then 1 L and 2 L of water</text>

  <text x="40" y="330" font-size="22" font-weight="700" fill="#1f2328">Wiring</text>

  <!-- Load cell -->
  <rect x="60" y="335" width="240" height="50" rx="6" fill="#dfe3e8" stroke="#6e7781" stroke-width="2"/>
  <circle cx="100" cy="360" r="9" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <circle cx="260" cy="360" r="9" fill="#ffffff" stroke="#6e7781" stroke-width="2"/>
  <rect x="150" y="350" width="60" height="20" rx="3" fill="#f6f8fa" stroke="#6e7781"/>
  <text x="180" y="365" font-size="12" text-anchor="middle" fill="#57606a">strain</text>
  <text x="180" y="410" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Load cell</text>
  <text x="180" y="430" font-size="14" text-anchor="middle" fill="#57606a">4 wires (check your kit)</text>
  <path d="M180 300 L180 328" stroke="#1f2328" stroke-width="3"/>
  <path d="M172 320 L180 332 L188 320" fill="none" stroke="#1f2328" stroke-width="3"/>
  <text x="194" y="314" font-size="14" fill="#57606a">weight</text>

  <!-- Cell to HX711 -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M300 344 C 360 344, 360 330, 432 330" stroke="#cf222e"/>
    <path d="M300 354 C 365 354, 365 362, 432 362" stroke="#1f2328"/>
    <path d="M300 366 C 370 366, 370 394, 432 394" stroke="#8c959f"/>
    <path d="M300 376 C 375 376, 375 426, 432 426" stroke="#2da44e"/>
  </g>
  <text x="60" y="462" font-size="13" fill="#57606a">red E+ · black E−</text>
  <text x="60" y="480" font-size="13" fill="#57606a">white A− · green A+</text>

  <!-- HX711 -->
  <rect x="432" y="300" width="170" height="230" rx="8" fill="#1f7a4d" stroke="#14532d" stroke-width="2"/>
  <rect x="487" y="390" width="60" height="44" rx="3" fill="#1f2328"/>
  <text x="517" y="417" font-size="12" text-anchor="middle" fill="#d0d7de">HX711</text>
  <text x="517" y="512" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">HX711</text>
  <g font-size="13" fill="#ffffff">
    <circle cx="444" cy="330" r="6" fill="#e3b341"/><text x="456" y="335">E+</text>
    <circle cx="444" cy="362" r="6" fill="#e3b341"/><text x="456" y="367">E−</text>
    <circle cx="444" cy="394" r="6" fill="#e3b341"/><text x="456" y="399">A−</text>
    <circle cx="444" cy="426" r="6" fill="#e3b341"/><text x="456" y="431">A+</text>
    <circle cx="444" cy="458" r="6" fill="#a8b1ba"/><text x="456" y="463" fill="#b7d9c4">B−</text>
    <circle cx="444" cy="482" r="6" fill="#a8b1ba"/><text x="456" y="487" fill="#b7d9c4">B+</text>
    <circle cx="590" cy="330" r="6" fill="#e3b341"/><text x="578" y="335" text-anchor="end">GND</text>
    <circle cx="590" cy="362" r="6" fill="#e3b341"/><text x="578" y="367" text-anchor="end">DT</text>
    <circle cx="590" cy="394" r="6" fill="#e3b341"/><text x="578" y="399" text-anchor="end">SCK</text>
    <circle cx="590" cy="426" r="6" fill="#e3b341"/><text x="578" y="431" text-anchor="end">VCC</text>
  </g>

  <!-- HX711 to NodeMCU -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M596 330 C 720 330, 730 438, 838 438" stroke="#1f2328"/>
    <path d="M596 362 C 720 362, 730 306, 838 306" stroke="#d4a72c"/>
    <path d="M596 394 C 720 394, 730 328, 838 328" stroke="#2f6fdb"/>
    <path d="M596 426 C 720 426, 730 416, 838 416" stroke="#cf222e"/>
  </g>
  <g font-size="13" fill="#57606a">
    <text x="648" y="560">GND → GND</text>
    <text x="648" y="578">DAT (DT) → D0 (GPIO16)</text>
    <text x="648" y="596">CLK (SCK) → D1 (GPIO5)</text>
    <text x="648" y="614">VCC → 3V3</text>
  </g>

  <!-- NodeMCU -->
  <rect x="826" y="270" width="170" height="380" rx="10" fill="#1b2a3a" stroke="#0d1520" stroke-width="2"/>
  <rect x="888" y="290" width="90" height="120" rx="4" fill="#c9ced6" stroke="#8c959f"/>
  <text x="933" y="345" font-size="13" text-anchor="middle" fill="#1f2328">ESP-12E</text>
  <text x="933" y="363" font-size="11" text-anchor="middle" fill="#57606a">ESP8266</text>
  <rect x="896" y="636" width="44" height="22" rx="3" fill="#8c959f"/>
  <text x="918" y="682" font-size="13" text-anchor="middle" fill="#57606a">USB power</text>
  <text x="940" y="510" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff" transform="rotate(-90 940 510)">NodeMCU</text>
  <g font-size="12" fill="#8c959f">
    <circle cx="838" cy="306" r="6" fill="#e3b341"/><text x="850" y="310" fill="#ffffff" font-weight="700">D0</text>
    <circle cx="838" cy="328" r="6" fill="#e3b341"/><text x="850" y="332" fill="#ffffff" font-weight="700">D1</text>
    <circle cx="838" cy="350" r="5" fill="#57606a"/><text x="850" y="354">D2</text>
    <circle cx="838" cy="372" r="5" fill="#57606a"/><text x="850" y="376">D3</text>
    <circle cx="838" cy="394" r="5" fill="#57606a"/><text x="850" y="398">D4</text>
    <circle cx="838" cy="416" r="6" fill="#e3b341"/><text x="850" y="420" fill="#ffffff" font-weight="700">3V3</text>
    <circle cx="838" cy="438" r="6" fill="#e3b341"/><text x="850" y="442" fill="#ffffff" font-weight="700">GND</text>
    <circle cx="838" cy="460" r="5" fill="#57606a"/><text x="850" y="464">D5</text>
    <circle cx="838" cy="482" r="5" fill="#57606a"/><text x="850" y="486">D6</text>
    <circle cx="838" cy="504" r="5" fill="#57606a"/><text x="850" y="508">D7</text>
    <circle cx="838" cy="526" r="5" fill="#57606a"/><text x="850" y="530">D8</text>
    <circle cx="838" cy="548" r="5" fill="#57606a"/><text x="850" y="552">RX</text>
    <circle cx="838" cy="570" r="5" fill="#57606a"/><text x="850" y="574">TX</text>
    <circle cx="838" cy="592" r="5" fill="#57606a"/><text x="850" y="596">GND</text>
    <circle cx="838" cy="614" r="5" fill="#57606a"/><text x="850" y="618">3V3</text>
  </g>
</svg>
